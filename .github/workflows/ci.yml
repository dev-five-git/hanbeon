name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 공개 저장소이므로 모든 작업은 GitHub 호스팅 러너에서 돈다.
  # self-hosted 러너에서 PR 코드를 실행하면 (postinstall, 테스트, 빌드)
  # 누구든 PR 하나로 우리 인프라에서 임의 코드를 돌릴 수 있다.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  changepacks:
    name: changepacks
    runs-on: ubuntu-latest
    permissions:
      # create pull request comments
      pull-requests: write

      # Actions > General > Workflow permissions for creating pull request
      # Create brench to create pull request
      contents: write
    needs:
      - check
    steps:
      - uses: actions/checkout@v7
      - uses: changepacks/action@ff3d7d0ddbce5dd21c4db0fc5932493b320cf85e # main
        id: changepacks
        with:
          # 한번은 레지스트리에 배포할 패키지가 아닌 private 앱이다.
          # publish 모드는 GitHub Release를 draft로 남기고 데스크톱 빌드에
          # 최종 공개를 위임하기 위해 사용한다.
          publish: true
    outputs:
      changepacks: ${{ steps.changepacks.outputs.changepacks }}
      pending_releases: ${{ steps.changepacks.outputs.pending_releases }}

  release-desktop:
    name: release (${{ matrix.platform }})
    needs:
      - changepacks
    if: ${{ contains(needs.changepacks.outputs.pending_releases, '"package.json"') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets || '' }}
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev \
            libudev-dev \
            patchelf \
            pkg-config
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and upload desktop bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          projectPath: apps/desktop
          releaseAssetNamePattern: hanbeon-[version]-[platform]-[arch]-[bundle][ext]
          releaseDraft: true
          releaseId: ${{ fromJSON(needs.changepacks.outputs.pending_releases)['package.json'].releaseId }}
          tagName: ${{ fromJSON(needs.changepacks.outputs.pending_releases)['package.json'].tagName }}
          tauriScript: bun tauri
          uploadUpdaterJson: false

  finalize-release:
    name: finalize release
    needs:
      - changepacks
      - release-desktop
    if: ${{ contains(needs.changepacks.outputs.pending_releases, '"package.json"') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        uses: changepacks/action@ff3d7d0ddbce5dd21c4db0fc5932493b320cf85e # main
        with:
          finalize_releases: ${{ needs.changepacks.outputs.pending_releases }}
